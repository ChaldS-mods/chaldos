# ChaldOS - syslinux boot menu footer (utility entries)

LABEL existing
TEXT HELP
Boot an existing operating system from disk.
ENDTEXT
MENU LABEL Boot Existing Disk
COM32 chain.c32
APPEND hd0 0

LABEL reboot
TEXT HELP
Restart the computer.
ENDTEXT
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Power off the computer.
ENDTEXT
MENU LABEL Power Off
COM32 poweroff.c32

# ChaldOS - BIOS kernel boot entries

LABEL chaldos
TEXT HELP
Boot ChaldOS Gaming Edition v2.0.
Starts the live gaming system.
ENDTEXT
MENU LABEL ChaldOS Gaming Edition v2.0
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% loglevel=7 console=ttyS0,115200

LABEL verbose
TEXT HELP
Boot ChaldOS with full kernel messages.
Useful for diagnosing boot problems.
ENDTEXT
MENU LABEL ChaldOS (Verbose)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% loglevel=7 console=ttyS0,115200

LABEL safemode
TEXT HELP
Boot ChaldOS with basic GPU drivers.
Use when the GPU driver fails.
ENDTEXT
MENU LABEL ChaldOS (Safe Mode)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset console=ttyS0,115200

LABEL copytoram
TEXT HELP
Load ISO into RAM for faster boot.
Recommended for weak USB drives.
ENDTEXT
MENU LABEL ChaldOS (Copy to RAM)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram console=ttyS0,115200
